site_name: Study reference library
site_description: >-
  Other people's courses, written up as one book per course from the course's slides,
  recordings, notes and problem sets.
site_url: https://claptar.github.io/knowledge-base-library/
repo_url: https://github.com/Claptar/knowledge-base-library
docs_dir: docs
site_dir: _site
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    # Render only the part of the nav this page needs. Material otherwise embeds the whole
    # tree in every page: the converted corpus once put 5.8 MB of sidebar on each of ~12,000
    # pages, far over GitHub Pages' 1 GB limit. With every book's chapters listed, pruning keeps
    # a page to its own book's sidebar — the site is ~120 MB, the largest page under 160 KB.
    - navigation.prune
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  # Maths. `generic: true` emits \(...\) / \[...\] wrappers for MathJax, which is
  # loaded below. Source stays `$…$` and `$$…$$` so the markdown reads as plain text.
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  # The entire nav is generated into docs/SUMMARY.md by this repo's
  # skills/normalise-materials/scripts/normalise_source.py. There is no hand-written `nav:` here and there should not be —
  # several thousand entries do not belong in a config file.
  - literate-nav:
      nav_file: SUMMARY.md
      implicit_index: true

# Every page is generated, and the generators rewrite every relative link to a published
# sibling or to the original. A warning here means the converter has a bug, which is
# exactly what this should catch — so the build stays strict even though nothing is hand-written.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  nav:
    # A book lists its chapters in the nav. A converted document's section pages do not appear:
    # it stops at the document, whose index page lists them, and they stay reachable from
    # previous/next links and from search.
    omitted_files: info
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
